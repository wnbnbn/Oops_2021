name: LocalFeed v0.9.4 Compile and Release

permissions:
  contents: write

on:
  push:
    branches:
      - localfeed-build
    paths-ignore:
      - localfeed_ci/update.json
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install API 36
        run: sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"
      - name: Stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d localfeed_ci/stable_debug_keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep SHA256
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify tracked v0.9.4 source
        run: python3 localfeed_ci/verify_v05_source.py
      - name: Pure Kotlin regression tests
        working-directory: LocalFeed
        run: bash tools/run-smoke-tests.sh
      - name: Assemble v0.9.4
        working-directory: LocalFeed
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Re-sign APK with fixed key
        run: |
          IN=LocalFeed/app/build/outputs/apk/debug/app-debug.apk
          OUT=LocalFeed/app/build/outputs/apk/debug/LocalFeed-v0.9.4-fixed-signature.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUT" \
            "$IN"
      - name: Verify fixed certificate
        run: |
          APK=LocalFeed/app/build/outputs/apk/debug/LocalFeed-v0.9.4-fixed-signature.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          EXPECTED=2fcf7ed9c4823aa9589c53102b559de274b7ab84f636ded79957aa88746ab7a6
          echo "certificate=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Package verified deliverables
        run: |
          mkdir -p dist
          cp LocalFeed/app/build/outputs/apk/debug/LocalFeed-v0.9.4-fixed-signature.apk dist/LocalFeed-v0.9.4.apk
          sha256sum dist/LocalFeed-v0.9.4.apk > dist/SHA256SUMS.txt
          {
            echo "LocalFeed v0.9.4 / versionCode 22"
            echo "Source commit: $GITHUB_SHA"
            echo "CI run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Source integrity, holo touch mapping, inbox/index, card games/geometry, feed/session/album/scanner smoke: PASS"
            echo "Android :app:assembleDebug: PASS"
            echo "Fixed certificate SHA256: 2fcf7ed9c4823aa9589c53102b559de274b7ab84f636ded79957aa88746ab7a6 (verified)"
            echo "OnePlus Ace 6 visual/decoder/performance acceptance: NOT RUN"
          } > dist/BUILD_REPORT.txt
          python3 - <<'PYZIP'
          from pathlib import Path
          import json, zipfile
          paths = list(json.loads(Path('localfeed_ci/v05_source_sha256.json').read_text()))
          paths += ['README.md', 'localfeed_ci/v05_source_sha256.json', 'localfeed_ci/verify_v05_source.py', 'localfeed_ci/stable_debug_keystore.b64', 'localfeed_ci/update.json', '.github/workflows/localfeed-v05-compile.yml']
          with zipfile.ZipFile('dist/LocalFeed-v0.9.4-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in paths: archive.write(name, name)
              archive.write('dist/BUILD_REPORT.txt', 'BUILD_REPORT.txt')
          PYZIP
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalFeed-v0.9.4-fixed-signature-apk
          path: dist/*
          if-no-files-found: error
      - name: Publish in-app update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view localfeed-v0.9.4 >/dev/null 2>&1; then
            gh release upload localfeed-v0.9.4 dist/LocalFeed-v0.9.4.apk dist/SHA256SUMS.txt dist/BUILD_REPORT.txt dist/LocalFeed-v0.9.4-source.zip --clobber
          else
            gh release create localfeed-v0.9.4 dist/LocalFeed-v0.9.4.apk dist/SHA256SUMS.txt dist/BUILD_REPORT.txt dist/LocalFeed-v0.9.4-source.zip \
              --target "$GITHUB_SHA" \
              --title "LocalFeed v0.9.4" \
              --notes "新增原生闪卡展示页和卡牌比赛触控反光，适配不同图片比例；重绘静态卡框，移除相册红心与等级文字。实机验收范围见 LocalFeed/docs/V0.9.4.md。" \
              --latest
          fi
