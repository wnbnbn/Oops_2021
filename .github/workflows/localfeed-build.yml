name: LocalFeed Android Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install stable development signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d localfeed_ci/stable_debug_keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA256|Owner|Valid from' || true

      - name: Rehydrate v0.2 baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          names = [
              'chunk_00.b64','chunk_01.b64','chunk_02.b64','chunk_03.b64',
              'chunk_04a.b64','chunk_04b.b64',
              'chunk_05.b64','chunk_06.b64','chunk_07.b64'
          ]
          raw = b''.join((Path('localfeed_ci') / name).read_bytes() for name in names)
          clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
          assert len(clean) == 62604, f'unexpected baseline base64 length: {len(clean)}'
          Path('/tmp/localfeed.zip').write_bytes(base64.b64decode(clean, validate=False))
          PY
          unzip -t /tmp/localfeed.zip
          mkdir -p /tmp/localfeed
          unzip -q /tmp/localfeed.zip -d /tmp/localfeed
          test -f /tmp/localfeed/LocalFeed_v0.2/settings.gradle.kts

      - name: Apply v0.3 stabilization patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          names = [
              'v03_patch_00.b64','v03_patch_01.b64',
              'v03_patch_02_0.b64','v03_patch_02_1.b64',
              'v03_patch_02_2_0.b64','v03_patch_02_2_1.b64',
              'v03_patch_02_3.b64','v03_patch_02_4.b64',
              'v03_patch_02_5.b64','v03_patch_02_6.b64'
          ]
          raw = b''.join((Path('localfeed_ci') / name).read_bytes() for name in names)
          clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
          assert len(clean) == 22816, f'unexpected patch base64 length: {len(clean)}'
          data = gzip.decompress(base64.b64decode(clean, validate=False))
          Path('/tmp/localfeed-v03.patch').write_bytes(data)
          print('v0.3 patch bytes', len(data))
          PY
          cd /tmp/localfeed/LocalFeed_v0.2
          patch -p1 < /tmp/localfeed-v03.patch
          grep -q 'versionName = "0.3.0"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'androidx.core:core-ktx:1.17.0' app/build.gradle.kts

      - name: Apply v0.4 P1 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re, hashlib
          names = [f'v04r_patch_{i:02d}.b64' for i in range(7)]
          expected = [
              (6000,'8cec325139132ff4869565edb74e65f1669ab4f9ac2a2db3ce0c07adec4f232a'),
              (6000,'9e8a1d8087e08fd875db96a06b8f231db15b76c9c9f0a42628bd3942dca0e8af'),
              (6000,'9dcfeeeff60edda06df7c95507f9feb238cdb759a79431bf6a5f744dc823bd55'),
              (6000,'abeaaddf06918cbc48bb12425282af543ab33fcde6de59e0eac822fbc770a1f1'),
              (6000,'ca6758dbd9c7d4ba5e8d0e46b1d5da8d082377ae8c277cb61b11be3953d4aa63'),
              (6000,'dd01957168ff963f183170aed5405f0cc15b7eaba42398485a461f0cfc950bec'),
              (4956,'a2c286fdfc7d772dcd7995bfa90cc2f65613eb595263fdf96bf1af79578d50b0')
          ]
          parts=[]
          for name,(want_len,want_sha) in zip(names,expected):
              part=re.sub(rb'[^A-Za-z0-9+/=]',b'',(Path('localfeed_ci')/name).read_bytes())
              got=hashlib.sha256(part).hexdigest()
              print(name, 'len=',len(part),'sha=',got,'expected=',want_len,want_sha)
              assert len(part)==want_len and got==want_sha, f'corrupt chunk: {name}'
              parts.append(part)
          clean=b''.join(parts)
          assert len(clean) == 40956
          data = gzip.decompress(base64.b64decode(clean, validate=True))
          assert len(data) == 147365
          assert hashlib.sha256(data).hexdigest() == 'd02bc35059a4cd807a6ae02f0e755d7e76785eabe1561daf98877499c8fee566'
          Path('/tmp/localfeed-v04.patch').write_bytes(data)

          # CI's v0.3 baseline already contains the AGP 9.4/Kotlin build-file compatibility edits.
          # Keep those build files out of the feature patch and normalize version/build settings below.
          text = data.decode('utf-8')
          sections = text.split('diff --git ')
          kept = [sections[0]]
          excluded = {
              'a/app/build.gradle.kts b/app/build.gradle.kts',
              'a/build.gradle.kts b/build.gradle.kts',
          }
          for sec in sections[1:]:
              header = sec.splitlines()[0].strip()
              if header in excluded:
                  print('exclude already-normalized build diff:', header)
                  continue
              kept.append('diff --git ' + sec)
          filtered = ''.join(kept)
          Path('/tmp/localfeed-v04-code.patch').write_text(filtered, encoding='utf-8')
          print('v0.4 full patch bytes', len(data), 'code patch bytes', len(filtered.encode('utf-8')))
          PY
          cd /tmp/localfeed/LocalFeed_v0.2
          patch --batch --forward -p1 < /tmp/localfeed-v04-code.patch

          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('app/build.gradle.kts')
          s = app.read_text(encoding='utf-8')
          s = s.replace('    id("org.jetbrains.kotlin.android")\n', '')
          s = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 4', s)
          s = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.4.0"', s)
          s = re.sub(r'\n\s*kotlinOptions\s*\{\s*\n\s*jvmTarget\s*=\s*"17"\s*\n\s*\}\s*\n', '\n', s, flags=re.S)
          app.write_text(s, encoding='utf-8')

          root = Path('build.gradle.kts')
          s = root.read_text(encoding='utf-8')
          s = re.sub(r'^\s*id\("org\.jetbrains\.kotlin\.android"\).*\n', '', s, flags=re.M)
          root.write_text(s, encoding='utf-8')
          PY

          grep -q 'versionCode = 4' app/build.gradle.kts
          grep -q 'versionName = "0.4.0"' app/build.gradle.kts
          ! grep -q 'org.jetbrains.kotlin.android' app/build.gradle.kts
          ! grep -q 'kotlinOptions' app/build.gradle.kts
          ! grep -q 'org.jetbrains.kotlin.android' build.gradle.kts
          grep -q 'class DuplicateScanner' app/src/main/java/com/localfeed/app/data/DuplicateScanner.kt
          grep -q 'class AlbumDragSelectTouchListener' app/src/main/java/com/localfeed/app/ui/AlbumDragSelectTouchListener.kt

      - name: Run v0.4 pure Kotlin checks
        working-directory: /tmp/localfeed/LocalFeed_v0.2
        run: |
          kotlinc app/src/main/java/com/localfeed/app/core/MediaRecord.kt app/src/main/java/com/localfeed/app/ui/AlbumQuery.kt tools/AlbumQueryTest.kt -include-runtime -d /tmp/album-query-test.jar
          java -jar /tmp/album-query-test.jar

      - name: Build v0.4 stable-signed debug APK
        working-directory: /tmp/localfeed/LocalFeed_v0.2
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK signing certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs /tmp/localfeed/LocalFeed_v0.2/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload v0.4 stable-signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalFeed-v0.4-stable-signed-debug-apk
          path: /tmp/localfeed/LocalFeed_v0.2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
