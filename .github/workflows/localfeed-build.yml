name: LocalFeed Android Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: SDK 36
        run: sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Stable signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d localfeed_ci/stable_debug_keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA256|Owner|Valid from' || true

      - name: Restore v0.2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          ns=['chunk_00.b64','chunk_01.b64','chunk_02.b64','chunk_03.b64','chunk_04a.b64','chunk_04b.b64','chunk_05.b64','chunk_06.b64','chunk_07.b64']
          b=re.sub(rb'[^A-Za-z0-9+/=]',b'',b''.join((Path('localfeed_ci')/n).read_bytes() for n in ns))
          assert len(b)==62604
          Path('/tmp/localfeed.zip').write_bytes(base64.b64decode(b))
          PY
          rm -rf /tmp/localfeed && mkdir -p /tmp/localfeed
          unzip -q /tmp/localfeed.zip -d /tmp/localfeed

      - name: Apply v0.3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          ns=['v03_patch_00.b64','v03_patch_01.b64','v03_patch_02_0.b64','v03_patch_02_1.b64','v03_patch_02_2_0.b64','v03_patch_02_2_1.b64','v03_patch_02_3.b64','v03_patch_02_4.b64','v03_patch_02_5.b64','v03_patch_02_6.b64']
          b=re.sub(rb'[^A-Za-z0-9+/=]',b'',b''.join((Path('localfeed_ci')/n).read_bytes() for n in ns))
          assert len(b)==22816
          Path('/tmp/v03.patch').write_bytes(gzip.decompress(base64.b64decode(b)))
          PY
          cd /tmp/localfeed/LocalFeed_v0.2
          patch -p1 < /tmp/v03.patch

      - name: Apply v0.4 tracked changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,re,hashlib
          ns=[f'v04r_patch_{i:02d}.b64' for i in range(7)]
          sizes=[6000,6000,6000,6000,6000,6000,4956]
          shas=['8cec325139132ff4869565edb74e65f1669ab4f9ac2a2db3ce0c07adec4f232a','9e8a1d8087e08fd875db96a06b8f231db15b76c9c9f0a42628bd3942dca0e8af','9dcfeeeff60edda06df7c95507f9feb238cdb759a79431bf6a5f744dc823bd55','abeaaddf06918cbc48bb12425282af543ab33fcde6de59e0eac822fbc770a1f1','ca6758dbd9c7d4ba5e8d0e46b1d5da8d082377ae8c277cb61b11be3953d4aa63','dd01957168ff963f183170aed5405f0cc15b7eaba42398485a461f0cfc950bec','a2c286fdfc7d772dcd7995bfa90cc2f65613eb595263fdf96bf1af79578d50b0']
          ps=[]
          for n,l,s in zip(ns,sizes,shas):
            p=re.sub(rb'[^A-Za-z0-9+/=]',b'',(Path('localfeed_ci')/n).read_bytes()); assert len(p)==l and hashlib.sha256(p).hexdigest()==s; ps.append(p)
          data=gzip.decompress(base64.b64decode(b''.join(ps),validate=True))
          assert len(data)==147365 and hashlib.sha256(data).hexdigest()=='d02bc35059a4cd807a6ae02f0e755d7e76785eabe1561daf98877499c8fee566'
          text=data.decode()
          out=[]
          for i,sec in enumerate(text.split('diff --git ')):
            if i==0: out.append(sec); continue
            h=sec.splitlines()[0].strip()
            if h in {'a/app/build.gradle.kts b/app/build.gradle.kts','a/build.gradle.kts b/build.gradle.kts'}: continue
            out.append('diff --git '+sec)
          Path('/tmp/v04.patch').write_text(''.join(out))
          PY
          cd /tmp/localfeed/LocalFeed_v0.2
          patch --batch --forward -p1 < /tmp/v04.patch

      - name: Restore v0.4 new files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,re,hashlib
          ns=['v04nf_00.b64','v04nf_01.b64','v04nf_02.b64','v04nf_03.b64']
          sizes=[3000,3000,3000,292]
          shas=['851e38feb6e88917b849a5d876b8fc9d461cdc431942d94f34535eb01531a580','41fb2dab63ea3191c4c10f3a4cd2a1463743faf5598915c553b66a3ca8e84d28','5ed857a3b6579168d63c081717e7fd90f3887c0434ab7e62749ec07593c0b40e','7619e1c772f45de136cb7bfa7764bb9b962a610e669d458f30fbc35c9856853c']
          ps=[]
          for n,l,s in zip(ns,sizes,shas):
            p=re.sub(rb'[^A-Za-z0-9+/=]',b'',(Path('localfeed_ci')/n).read_bytes())
            print(n,len(p),hashlib.sha256(p).hexdigest()); assert len(p)==l and hashlib.sha256(p).hexdigest()==s; ps.append(p)
          b=b''.join(ps); assert len(b)==9292 and hashlib.sha256(b).hexdigest()=='bf8db9ae56e96dbf50569d188c913975e6a761d00724dd977315cd0eea9bdd93'
          data=base64.b64decode(b,validate=True); assert len(data)==6968 and hashlib.sha256(data).hexdigest()=='b4a66545ffcda3c3479a243a6428b3b5cbaec3907da50fd91b5abb20618f666e'
          Path('/tmp/v04new.tar.gz').write_bytes(data)
          PY
          cd /tmp/localfeed/LocalFeed_v0.2
          tar -xzf /tmp/v04new.tar.gz
          test -f app/src/main/java/com/localfeed/app/data/DuplicateScanner.kt
          test -f app/src/main/java/com/localfeed/app/ui/AlbumDragSelectTouchListener.kt
          test -f app/src/main/java/com/localfeed/app/ui/AlbumQuery.kt

      - name: Normalize AGP 9.4 build files
        working-directory: /tmp/localfeed/LocalFeed_v0.2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle.kts'); s=p.read_text(); s=s.replace('    id("org.jetbrains.kotlin.android")\n',''); s=re.sub(r'versionCode\s*=\s*\d+','versionCode = 4',s); s=re.sub(r'versionName\s*=\s*"[^"]+"','versionName = "0.4.0"',s); s=re.sub(r'\n\s*kotlinOptions\s*\{.*?\n\s*\}\s*\n','\n',s,flags=re.S); p.write_text(s)
          p=Path('build.gradle.kts'); s=p.read_text(); s=re.sub(r'^\s*id\("org\.jetbrains\.kotlin\.android"\).*\n','',s,flags=re.M); p.write_text(s)
          PY
          grep -q 'versionName = "0.4.0"' app/build.gradle.kts
          ! grep -q 'org.jetbrains.kotlin.android' app/build.gradle.kts
          ! grep -q 'kotlinOptions' app/build.gradle.kts

      - name: Build v0.4 APK
        working-directory: /tmp/localfeed/LocalFeed_v0.2
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs /tmp/localfeed/LocalFeed_v0.2/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LocalFeed-v0.4-stable-signed-debug-apk
          path: /tmp/localfeed/LocalFeed_v0.2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
