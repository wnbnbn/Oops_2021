name: LocalFeed Android Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose source chunks
        run: |
          wc -c localfeed_ci/chunk_*.b64
          sha256sum localfeed_ci/chunk_*.b64

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Rehydrate LocalFeed source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          parts = sorted(Path('localfeed_ci').glob('chunk_*.b64'))
          raw = b''.join(p.read_bytes() for p in parts)
          clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
          data = base64.b64decode(clean, validate=False)
          Path('/tmp/localfeed.zip').write_bytes(data)
          print('chunks', len(parts), 'raw', len(raw), 'clean', len(clean), 'zip', len(data))
          PY
          unzip -t /tmp/localfeed.zip
          mkdir -p /tmp/localfeed
          unzip -q /tmp/localfeed.zip -d /tmp/localfeed
          test -f /tmp/localfeed/LocalFeed_v0.2/settings.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/' /tmp/localfeed/LocalFeed_v0.2/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' /tmp/localfeed/LocalFeed_v0.2/app/build.gradle.kts

      - name: Build debug APK
        working-directory: /tmp/localfeed/LocalFeed_v0.2
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalFeed-v0.2-debug-apk
          path: /tmp/localfeed/LocalFeed_v0.2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
