name: LocalFeed Android Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "platform-tools" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install stable development signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d localfeed_ci/stable_debug_keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA256|Owner|Valid from' || true

      - name: Rehydrate v0.2 baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          names = [
              'chunk_00.b64','chunk_01.b64','chunk_02.b64','chunk_03.b64',
              'chunk_04a.b64','chunk_04b.b64',
              'chunk_05.b64','chunk_06.b64','chunk_07.b64'
          ]
          raw = b''.join((Path('localfeed_ci') / name).read_bytes() for name in names)
          clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
          assert len(clean) == 62604, f'unexpected baseline base64 length: {len(clean)}'
          Path('/tmp/localfeed.zip').write_bytes(base64.b64decode(clean, validate=False))
          PY
          unzip -t /tmp/localfeed.zip
          mkdir -p /tmp/localfeed
          unzip -q /tmp/localfeed.zip -d /tmp/localfeed
          test -f /tmp/localfeed/LocalFeed_v0.2/settings.gradle.kts

      - name: Apply v0.3 stabilization patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          names = [
              'v03_patch_00.b64','v03_patch_01.b64',
              'v03_patch_02_0.b64','v03_patch_02_1.b64',
              'v03_patch_02_2_0.b64','v03_patch_02_2_1.b64',
              'v03_patch_02_3.b64','v03_patch_02_4.b64',
              'v03_patch_02_5.b64','v03_patch_02_6.b64'
          ]
          raw = b''.join((Path('localfeed_ci') / name).read_bytes() for name in names)
          clean = re.sub(rb'[^A-Za-z0-9+/=]', b'', raw)
          assert len(clean) == 22816, f'unexpected patch base64 length: {len(clean)}'
          data = gzip.decompress(base64.b64decode(clean, validate=False))
          Path('/tmp/localfeed-v03.patch').write_bytes(data)
          print('patch bytes', len(data))
          PY
          cd /tmp/localfeed/LocalFeed_v0.2
          patch -p1 < /tmp/localfeed-v03.patch
          grep -q 'versionName = "0.3.0"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'androidx.core:core-ktx:1.17.0' app/build.gradle.kts

      - name: Build v0.3 stable-signed debug APK
        working-directory: /tmp/localfeed/LocalFeed_v0.2
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK signing certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs /tmp/localfeed/LocalFeed_v0.2/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload v0.3 stable-signed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalFeed-v0.3-stable-signed-debug-apk
          path: /tmp/localfeed/LocalFeed_v0.2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
