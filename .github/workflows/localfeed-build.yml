name: LocalFeed Android Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Rehydrate LocalFeed source
        run: |
          cat localfeed_ci/chunk_*.b64 > /tmp/localfeed.b64
          base64 -d /tmp/localfeed.b64 > /tmp/localfeed.zip
          mkdir -p /tmp/localfeed
          unzip -q /tmp/localfeed.zip -d /tmp/localfeed
          test -f /tmp/localfeed/LocalFeed_v0.2/settings.gradle.kts
          sed -i 's/compileSdk = 37/compileSdk = 36/' /tmp/localfeed/LocalFeed_v0.2/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' /tmp/localfeed/LocalFeed_v0.2/app/build.gradle.kts

      - name: Build debug APK
        working-directory: /tmp/localfeed/LocalFeed_v0.2
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalFeed-v0.2-debug-apk
          path: /tmp/localfeed/LocalFeed_v0.2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
